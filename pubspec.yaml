name: tripo
description: "Tripo — premium travel companion for weather, maps & packages."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_maps_flutter: ^2.10.0
  geolocator: ^13.0.2
  url_launcher: ^6.3.1
  http: ^1.2.2
  shared_preferences: ^2.3.3
  intl: 0.20.2
  shimmer: ^3.0.0
  path_provider: ^2.1.6
  open_filex: ^4.7.0
  path: ^1.9.1
  file_picker: 8.1.7
  sensors_plus: ^7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/weather/
